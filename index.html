  answered=true;
  const q=questions[idx], buttons=[...document.querySelectorAll('.option')];
  buttons.forEach((b,i)=>b.disabled=true);
  if(choice===q.answer){
    score++;
    buttons[choice].classList.add('correct');
    document.getElementById('feedback').textContent='✓ Chính xác!';
    document.getElementById('feedback').style.color='#168534';
  } else {
    buttons[choice].classList.add('wrong');
    buttons[q.answer].classList.add('correct');
    document.getElementById('feedback').textContent='✗ Sai — đáp án đúng đã được tô xanh.';
    document.getElementById('feedback').style.color='#c01818';
  }
  document.getElementById('score').textContent=`Điểm: ${score}`;
  document.getElementById('pinyin').style.display='flex';
  document.getElementById('next').style.display='block';
}

// ===== PHÁT ÂM TIẾNG TRUNG TỰ NHIÊN HƠN =====
// Ưu tiên giọng Trung Quốc bản địa/Natural nếu thiết bị có sẵn.
// Trên Android/Chrome, giọng đọc phụ thuộc vào các voice engine đã cài trên máy.
let chineseVoices = [];

function loadChineseVoices(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  chineseVoices = voices.filter(v =>
    /^zh(-|_|$)/i.test(v.lang) ||
    /Chinese|中文|普通话|Mandarin/i.test(v.name)
  );
}

function pickNaturalChineseVoice(){
  if(!chineseVoices.length) return null;

  // Ưu tiên các giọng Natural thường nghe tự nhiên hơn.
  const preferred = [
    /Xiaoxiao.*Natural/i,
    /Yunxi.*Natural/i,
    /Yunjian.*Natural/i,
    /Xiaoyi.*Natural/i,
    /Microsoft.*Natural/i,
    /Google.*Chinese/i,
    /Ting-Ting/i
  ];

  for(const pattern of preferred){
    const found = chineseVoices.find(v => pattern.test(v.name));
    if(found) return found;
  }

  // Sau đó ưu tiên zh-CN/zh-Hans, tránh các giọng vùng khác nếu có lựa chọn.
  return chineseVoices.find(v => /^zh-CN/i.test(v.lang)) ||
         chineseVoices.find(v => /^zh-Hans/i.test(v.lang)) ||
         chineseVoices[0];
}

if('speechSynthesis' in window){
  loadChineseVoices();
  window.speechSynthesis.onvoiceschanged = loadChineseVoices;
}

document.getElementById('speakBtn').onclick=()=>{
  if(!answered) return;
  const q=questions[idx];

  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();

    const utterance=new SpeechSynthesisUtterance(q.word);
    const voice=pickNaturalChineseVoice();

    if(voice){
      utterance.voice=voice;
      utterance.lang=voice.lang;
    }else{
      utterance.lang='zh-CN';
    }

    // Tốc độ gần với cách phát âm tự nhiên, không kéo chữ như giọng máy.
    utterance.rate = q.word.length >= 3 ? 0.92 : 0.88;
    utterance.pitch = 1.02;
    utterance.volume = 1;

    // Một số trình duyệt trên Android có thể đọc lại bằng voice mặc định
    // nếu voice chưa sẵn sàng; chờ rất ngắn rồi phát để voice được nạp.
    setTimeout(()=>{
      window.speechSynthesis.speak(utterance);
    }, 60);
  }
};

document.getElementById('next').onclick=()=>{
  idx++;
  if(idx>=questions.length){
    document.getElementById('quiz').style.display='none';
    document.getElementById('summary').style.display='block';
    document.getElementById('finalScore').textContent=`${score} / ${questions.length}`;
    document.getElementById('finalText').textContent=`Bạn đã hoàn thành toàn bộ ${questions.length} từ HSK 5.`;
  } else render();
};
document.getElementById('restart').onclick=()=>{idx=0;score=0;render();};
document.getElementById('random').onclick=()=>{idx=Math.floor(Math.random()*questions.length);render();};
render();

        function shuffleQuestions() {
            // Fisher-Yates shuffle: đảo thứ tự 1295 câu, không làm thay đổi nội dung từng câu.
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            current = 0;
            score = 0;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Tự động đảo toàn bộ câu hỏi ngay khi mở trang.
        shuffleQuestions();
